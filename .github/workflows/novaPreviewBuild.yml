# Nova preview build
#
# Builds a debug APK for testing on the Retroid Pocket Nova whenever a pull
# request is opened/updated in this fork, publishes it as the "nova-preview"
# pre-release, and comments the download link on the PR. The newest build is
# always at:
#   https://github.com/<owner>/Unciv/releases/download/nova-preview/Unciv-nova.apk
#
# Can also be run by hand from the Actions tab (builds the selected branch).

name: Nova preview build

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write        # create/update the nova-preview release
  pull-requests: write   # comment the download link on the PR

concurrency:
  group: nova-preview-build
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Fork-only: never run on upstream, and only for PRs opened inside this fork
    if: >-
      github.repository != 'yairm210/Unciv' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the branch head itself, not GitHub's temporary merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :android:assembleDebug

      - name: Rename APK
        run: |
          APK=$(find android/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" Unciv-nova.apk
          ls -lh Unciv-nova.apk

      - name: Keep APK as a workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: Unciv-nova-${{ github.event.pull_request.head.sha || github.sha }}
          path: Unciv-nova.apk
          retention-days: 14

      - name: Publish to the nova-preview pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          URL="https://github.com/${REPO}/releases/download/nova-preview/Unciv-nova.apk"
          NOTES="Debug preview build of ${SHORT_SHA}, built $(date -u '+%Y-%m-%d %H:%M UTC').

          Download on the Nova: ${URL}"
          # Recreate each time so the tag always points at the newest build
          gh release delete nova-preview --repo "$REPO" --yes --cleanup-tag || true
          gh release create nova-preview Unciv-nova.apk \
            --repo "$REPO" \
            --prerelease \
            --target "$SHA" \
            --title "Nova preview (${SHORT_SHA})" \
            --notes "$NOTES"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "📱 Nova preview APK for ${SHORT_SHA} is ready: ${URL}"
          fi
